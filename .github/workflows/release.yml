name: Verify or publish an existing MGSTC draft

# Local Windows produces both binaries and the formal DB package together.
# This workflow never builds binaries, acquires a DB, creates tags or drafts.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Verify only, or request protected Alpha publication
        type: choice
        options: [verify, publish]
        default: verify
        required: true
      tag:
        description: Exact candidate tag, including v
        type: string
        required: true
      commit:
        description: Full 40-character candidate commit SHA
        type: string
        required: true
      assets_digest:
        description: assetsDigest from the verified local candidate
        type: string
        required: true
      notes_sha256:
        description: notesSha256 from the reviewed local candidate
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: mgstc-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_COMMIT: ${{ inputs.commit }}
  RELEASE_ASSETS_DIGEST: ${{ inputs.assets_digest }}
  RELEASE_NOTES_SHA256: ${{ inputs.notes_sha256 }}

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Require exact identity inputs before checking out any candidate code
        shell: pwsh
        run: |
          $dispatch = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cne ('refs/heads/' + $dispatch.repository.default_branch)) { throw 'Dispatch this workflow from the default branch.' }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+(?:\.\d+)?$' -or $env:RELEASE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:RELEASE_ASSETS_DIGEST -notmatch '^[a-f0-9]{64}$' -or $env:RELEASE_NOTES_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Supply the exact verified local candidate tag, commit and digests.' }
      - name: Check out the exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify draft assets, source, notes, documents and Environment rules
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./tools/publish-release.ps1 -Repository $env:GITHUB_REPOSITORY -CandidateDirectory (Join-Path $env:RUNNER_TEMP 'mgstc-verify') -FromGitHubDraft -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -AssetsDigest $env:RELEASE_ASSETS_DIGEST -NotesSha256 $env:RELEASE_NOTES_SHA256 -GitHubActions

  publish:
    needs: verify
    if: inputs.action == 'publish'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    environment: mgstc-release
    steps:
      - name: Check out the same candidate source after approval
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate and publish Alpha only after actual Required reviewer approval
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./tools/publish-release.ps1 -Repository $env:GITHUB_REPOSITORY -CandidateDirectory (Join-Path $env:RUNNER_TEMP 'mgstc-publish') -FromGitHubDraft -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -AssetsDigest $env:RELEASE_ASSETS_DIGEST -NotesSha256 $env:RELEASE_NOTES_SHA256 -GitHubActions -Execute
